# ─────────────────────────────────────────────────────────────
# Park Group 관리자 설정 (Decap CMS)
# 현재 연구실의 GitHub와 로그인 연결 설정이 반영되어 있습니다.
#   자세한 순서는 SETUP-KO.md 를 보세요.
# ─────────────────────────────────────────────────────────────
backend:
  name: github
  auth_scope: public_repo
  repo: mitsuriny0214/Parklab_FIMCL                           # [ ★ 수정 필요 ] 예: parklab-kaist/parklab-site
  branch: main
  base_url: https://sveltia-cms-auth.mitsuriny0214.workers.dev  # [ ★ 수정 필요 ] Cloudflare 로그인 중계 주소
  commit_messages:
    create: "관리자 화면에서 새 항목 추가: {{collection}} {{slug}}"
    update: "관리자 화면에서 수정: {{collection}} {{slug}}"
    delete: "관리자 화면에서 삭제: {{collection}} {{slug}}"
    uploadMedia: "사진 업로드: {{path}}"
    deleteMedia: "사진 삭제: {{path}}"

# 내 컴퓨터에서만 시험할 때 쓰는 설정입니다. 실제 사이트(주소가 localhost가 아닐 때)에서는 무시됩니다.
local_backend: true

locale: ko
publish_mode: simple        # '게시'를 누르면 바로 공개됩니다 (검토 단계 없음)
site_url: https://mitsuriny0214.github.io/Parklab_FIMCL/   # [ ★ 수정 필요 ] 공개 사이트 주소 (관리자 화면의 '사이트 보기' 링크)
media_folder: images/uploads
public_folder: images/uploads

collections:
  - name: pages
    label: 페이지
    files:
      - name: home
        label: Home
        file: content/home.json
        format: json
        fields:
          - label: 페이지 블록
            name: blocks
            widget: list
            label_singular: 블록
            hint: "블록을 추가·삭제하고, 왼쪽의 점 6개(⋮⋮)를 잡아 끌어서 순서를 바꿀 수 있어요. 위에서 아래 순서대로 화면에 나옵니다."
            types:
              # ───────── 배너(큰 사진 + 제목) ─────────
              - label: 배너 (큰 사진 + 제목)
                name: hero
                widget: object
                summary: "배너 · {{fields.title}}"
                fields:
                  - { label: 배경 사진, name: image, widget: image, required: false, hint: "영역을 채우는 배경 사진입니다. 로고 전체 표시에는 사진 한 장 또는 사이트 공통 → 푸터 로고를 사용하세요." }
                  - { label: 작은 글줄 (위), name: kicker, widget: string, required: false }
                  - { label: 큰 제목, name: title, widget: string, required: false }
                  - { label: 배너 높이 (px), name: height, widget: number, value_type: int, min: 80, max: 900, default: 324 }
                  - { label: 사진 위 어둡게 (0~90), name: overlay, widget: number, value_type: int, min: 0, max: 90, default: 0, hint: "글자가 안 보이면 숫자를 올리세요. 0은 그대로예요." }
                  - &style
                    label: 글자·색·정렬·여백 설정
                    name: style
                    widget: object
                    collapsed: true
                    summary: "크기 {{fields.font_size}} / 정렬 {{fields.align}}"
                    fields:
                      - { label: 본문 글자 크기 (px), name: font_size, widget: number, value_type: int, min: 10, max: 120, required: false, hint: "비우면 기본값(17)이에요. 배너에서는 위쪽 작은 글줄 크기예요." }
                      - { label: 제목 글자 크기 (px), name: heading_size, widget: number, value_type: int, min: 10, max: 160, required: false, hint: "비우면 기본값(30)이에요." }
                      - { label: 글자색, name: text_color, widget: color, allowInput: true, required: false, hint: "비우면 기본 색이에요." }
                      - { label: 제목 글자색, name: heading_color, widget: color, allowInput: true, required: false, hint: "비우면 글자색을 따라가요." }
                      - { label: 배경색, name: bg_color, widget: color, allowInput: true, required: false, hint: "비우면 투명이에요." }
                      - label: 정렬
                        name: align
                        widget: select
                        default: left
                        options: [{ label: 왼쪽, value: left }, { label: 가운데, value: center }, { label: 오른쪽, value: right }]
                      - { label: 위 여백 (px), name: pad_top, widget: number, value_type: int, min: 0, max: 400, required: false, hint: "비우면 기본값(40)이에요. 0을 넣으면 여백이 없어요." }
                      - { label: 아래 여백 (px), name: pad_bottom, widget: number, value_type: int, min: 0, max: 400, required: false }

              # ───────── 글 ─────────
              - &t_text
                label: 글
                name: text
                widget: object
                summary: "글 · {{fields.heading}}"
                fields:
                  - { label: 제목, name: heading, widget: string, required: false }
                  - { label: 본문, name: body, widget: markdown, required: false, buttons: [bold, italic, link, heading-two, bulleted-list, numbered-list], editor_components: [] }
                  - *style

              # ───────── 사진 + 글 (좌우 배치) ─────────
              - &t_image_text
                label: 사진 + 글 (좌우 배치)
                name: image_text
                widget: object
                summary: "사진+글 · {{fields.heading}}"
                fields:
                  - { label: 사진, name: image, widget: image, required: false }
                  - { label: 사진 설명 (시각장애인용 대체 글), name: alt, widget: string, required: false }
                  - label: 사진 위치
                    name: image_side
                    widget: select
                    default: left
                    options: [{ label: 사진이 왼쪽, value: left }, { label: 사진이 오른쪽, value: right }]
                  - { label: 사진 너비 (%), name: image_width, widget: number, value_type: int, min: 10, max: 100, default: 40, hint: "블록 전체 너비 대비 %예요. 모바일에서는 위아래로 쌓여요." }
                  - label: 사진과 글의 세로 맞춤
                    name: vertical_align
                    widget: select
                    default: flex-start
                    options: [{ label: 위쪽 맞춤, value: flex-start }, { label: 가운데 맞춤, value: center }, { label: 아래쪽 맞춤, value: flex-end }]
                  - { label: 제목, name: heading, widget: string, required: false }
                  - { label: 본문, name: body, widget: markdown, required: false, buttons: [bold, italic, link, heading-two, bulleted-list, numbered-list], editor_components: [] }
                  - *style

              # ───────── 사진 한 장 ─────────
              - &t_image
                label: 사진 한 장
                name: image
                widget: object
                summary: "사진 · {{fields.caption}}"
                fields:
                  - { label: 사진, name: image, widget: image, required: false }
                  - { label: 사진 설명 (대체 글), name: alt, widget: string, required: false }
                  - { label: 사진 아래 설명글, name: caption, widget: string, required: false }
                  - { label: 사진 너비 (%), name: image_width, widget: number, value_type: int, min: 10, max: 100, default: 100 }
                  - *style

              # ───────── 뉴스 목록 ─────────
              - label: 뉴스 목록
                name: news_list
                widget: object
                summary: "뉴스 · {{fields.heading}}"
                fields:
                  - { label: 제목, name: heading, widget: string, required: false }
                  - label: 뉴스 항목
                    name: items
                    widget: list
                    label_singular: 뉴스
                    summary: "{{fields.date}} · {{fields.text}}"
                    hint: "날짜가 최신인 항목이 위에 자동으로 정렬돼요. 순서를 따로 바꿀 필요가 없어요."
                    fields:
                      - { label: 날짜, name: date, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD" }
                      - { label: 내용, name: text, widget: markdown, buttons: [bold, italic, link], editor_components: [], modes: [rich_text] }
                  - { label: 오른쪽 안내 글 (주소 등), name: side_text, widget: markdown, required: false, buttons: [bold, italic, link], editor_components: [] }
                  - *style

              # ───────── 버튼 ─────────
              - &t_button
                label: 버튼
                name: button
                widget: object
                summary: "버튼 · {{fields.label}}"
                fields:
                  - { label: 버튼 글자, name: label, widget: string }
                  - { label: 연결할 주소, name: url, widget: string, hint: "https://로 시작하는 전체 주소를 쓰세요." }
                  - { label: 버튼 색, name: button_color, widget: color, allowInput: true, required: false }
                  - *style

              # ───────── 빈 공간 ─────────
              - &t_spacer
                label: 빈 공간 / 색 띠
                name: spacer
                widget: object
                summary: "빈 공간 · {{fields.height}}px"
                fields:
                  - { label: 높이 (px), name: height, widget: number, value_type: int, min: 0, max: 600, default: 60 }
                  - label: 설정
                    name: style
                    widget: object
                    collapsed: true
                    fields:
                      - { label: 배경색, name: bg_color, widget: color, allowInput: true, required: false }

      # ═════════ 아래는 하위 페이지입니다 (Research · Group · Alumni · Photos · Publications · Teaching · Contact) ═════════
      - name: research
        label: "Research"
        file: content/research.json
        format: json
        fields:
          - label: 페이지 블록
            name: blocks
            widget: list
            label_singular: 블록
            hint: "블록을 추가·삭제하고, 왼쪽의 점 6개(⋮⋮)를 잡아 끌어서 순서를 바꿀 수 있어요. 위에서 아래 순서대로 화면에 나옵니다."
            types:
              - &t_page_title
                label: 페이지 제목 (큰 제목 + 가는 줄)
                name: page_title
                widget: object
                summary: "제목 · {{fields.title}}"
                fields:
                  - { label: "제목", name: title, widget: string }
                  - { label: "제목 글자를 보통 굵기로 (끄면 굵게)", name: title_regular, widget: boolean, default: false }
                  - { label: "제목 아래 가는 줄 보이기", name: rule, widget: boolean, default: true }
                  - { label: "제목과 가는 줄 사이 간격 (px)", name: rule_gap, widget: number, value_type: int, min: 0, max: 200, default: 28 }
                  - { label: "오른쪽 버튼 글자 (비우면 숨김)", name: button_label, widget: string, required: false, hint: "예: Alumni 페이지의 UPDATE INFORMATION 버튼" }
                  - { label: "오른쪽 버튼 연결 주소", name: button_url, widget: string, required: false }
                  - *style
              - &t_richtext
                label: 글 (너비 지정)
                name: richtext
                widget: object
                summary: "글 · {{fields.heading}}"
                fields:
                  - { label: "제목", name: heading, widget: string, required: false }
                  - { label: "본문", name: body, widget: markdown, required: false, buttons: [bold, italic, link, heading-two, bulleted-list, numbered-list], editor_components: [] }
                  - { label: "글 너비 (px)", name: width, widget: number, value_type: int, min: 0, max: 1020, required: false, hint: "비우면 전체 너비예요. Research는 676입니다. 글 상자는 가운데에 놓입니다." }
                  - *style
              - &t_slideshow
                label: 슬라이드쇼 (자동으로 넘어가는 큰 사진)
                name: slideshow
                widget: object
                summary: "슬라이드쇼"
                fields:
                  - label: 사진 목록
                    name: images
                    widget: list
                    label_singular: 사진
                    summary: "{{fields.image}}"
                    hint: "위에서 아래 순서로 넘어갑니다. 점 6개(⋮⋮)를 끌어서 순서를 바꿔요."
                    fields:
                      - { label: "사진", name: image, widget: image }
                      - { label: "사진 설명 (대체 글)", name: alt, widget: string, required: false }
                  - { label: "넘어가는 시간 (초, 0이면 자동 넘김 없음)", name: interval, widget: number, value_type: int, min: 0, max: 60, default: 5 }
                  - { label: "영역 높이 (px, 너비 1020 기준)", name: height, widget: number, value_type: int, min: 200, max: 1200, default: 662 }
                  - { label: "사진 오른쪽 아래 버튼 글자 (비우면 숨김)", name: button_label, widget: string, required: false }
                  - { label: "버튼 연결 주소", name: button_url, widget: string, required: false, hint: "새 사이트 안의 페이지는 alumni.html 처럼 파일 이름만 쓰세요." }
                  - *style
              - &t_members
                label: 구성원 목록 (사진 + 이름 + 소개)
                name: members
                widget: object
                summary: "구성원 · {{fields.heading}}"
                fields:
                  - { label: "구역 제목 (예: GRADUATE STUDENTS)", name: heading, widget: string, required: false }
                  - { label: "위쪽에 가는 줄 보이기", name: rule_top, widget: boolean, default: true }
                  - label: 구성원
                    name: items
                    widget: list
                    label_singular: 구성원
                    summary: "{{fields.name}}"
                    hint: "‘구성원 추가’로 새 사람을 넣고, 점 6개(⋮⋮)를 끌어서 순서를 바꿔요. 삭제는 항목 오른쪽 위의 휴지통 모양이에요."
                    fields:
                      - { label: "사진", name: photo, widget: image, required: false }
                      - { label: "이름", name: name, widget: string }
                      - { label: "이름을 크게 (교수님용)", name: name_large, widget: boolean, default: false }
                      - { label: "직책·구분 (작은 글씨, 예: Graduate Student, G2)", name: role, widget: markdown, required: false, buttons: [bold, italic, link], editor_components: [], modes: [rich_text] }
                      - { label: "소개 (학력·경력·이메일 등)", name: details, widget: markdown, required: false, buttons: [bold, italic, link], editor_components: [], modes: [rich_text], hint: "줄을 바꿀 때마다 한 줄씩 나와요. 빈 줄 간격이 필요하면 스페이스 한 번만 누르고 줄바꿈하세요." }
                      - { label: "링크 줄 (CV | Google Scholar | X)", name: links, widget: markdown, required: false, buttons: [bold, italic, link], editor_components: [], modes: [rich_text], hint: "작은 글씨로 맨 아래에 나옵니다. 글자를 드래그하고 링크 버튼으로 주소를 넣으세요." }
                  - *style
              - &t_line_list
                label: 이름 목록 (한 줄씩)
                name: line_list
                widget: object
                summary: "목록 · {{fields.heading}}"
                fields:
                  - { label: "제목 (예: GRADUATE STUDENTS)", name: heading, widget: string, required: false }
                  - label: 줄
                    name: items
                    widget: list
                    label_singular: 줄
                    summary: "{{fields.text}}"
                    hint: "굵게는 **글자**, 기울임은 *글자* 처럼 별표로 감싸면 돼요."
                    fields:
                      - { label: "내용", name: text, widget: string }
                  - *style
              - &t_course_list
                label: 강의 목록
                name: course_list
                widget: object
                summary: "강의 목록"
                fields:
                  - label: 강의
                    name: items
                    widget: list
                    label_singular: 강의
                    summary: "{{fields.code}} {{fields.title}}"
                    fields:
                      - { label: "과목 번호 (예: CHEM101)", name: code, widget: string }
                      - { label: "과목 이름과 학기", name: title, widget: string }
                  - *style
              - &t_publications
                label: 논문 목록 (연도별)
                name: publications
                widget: object
                summary: "논문 목록"
                fields:
                  - label: 연도 묶음
                    name: groups
                    widget: list
                    label_singular: 연도
                    add_to_top: true
                    summary: "{{fields.year}}"
                    hint: "연도 묶음을 추가·삭제·순서 변경할 수 있어요. 새 연도·새 논문은 맨 위에 추가돼요. 논문은 해당 연도 묶음을 열어 ‘논문 추가’를 누르세요."
                    fields:
                      - { label: "연도 (예: 2026)", name: year, widget: string, required: false }
                      - label: 논문
                        name: items
                        widget: list
                        label_singular: 논문
                        add_to_top: true
                        summary: "{{fields.number}}. {{fields.title}}"
                        fields:
                          - { label: "번호 (예: 57)", name: number, widget: string, required: false }
                          - { label: "논문 제목", name: title, widget: markdown, required: false, buttons: [bold, italic, link], editor_components: [], modes: [rich_text] }
                          - { label: "논문 링크 (제목을 누르면 열림)", name: url, widget: string, required: false, hint: "https://로 시작하는 주소. 비우면 링크 없이 제목만 나와요." }
                          - { label: "저자", name: authors, widget: markdown, required: false, buttons: [bold, italic, link], editor_components: [], modes: [rich_text] }
                          - { label: "학술지·연도", name: journal, widget: markdown, required: false, buttons: [bold, italic, link], editor_components: [], modes: [rich_text] }
                          - { label: "추가 설명 (예: Special issue)", name: note, widget: markdown, required: false, buttons: [bold, italic, link], editor_components: [], modes: [rich_text] }
                          - label: 대표 그림
                            name: images
                            widget: list
                            label_singular: 그림
                            required: false
                            summary: "{{fields.image}}"
                            fields:
                              - { label: "그림", name: image, widget: image }
                              - { label: "그림 설명 (대체 글)", name: alt, widget: string, required: false }
                              - { label: "표시 너비 (px)", name: width, widget: number, value_type: int, min: 40, max: 400, default: 230 }
                  - *style
              - &t_photo_grid
                label: 사진첩 (눌러서 크게 보기)
                name: photo_grid
                widget: object
                summary: "사진첩"
                fields:
                  - { label: "한 줄에 보여줄 사진 수 (모바일은 자동으로 2장)", name: columns, widget: number, value_type: int, min: 1, max: 8, default: 4 }
                  - label: 사진
                    name: items
                    widget: list
                    label_singular: 사진
                    add_to_top: true
                    summary: "{{fields.title}}"
                    hint: "‘사진 추가’를 누르면 새 사진이 맨 위에 들어가요. 맨 위가 가장 먼저 나옵니다. 점 6개(⋮⋮)를 끌어서 순서를 바꿀 수 있어요."
                    fields:
                      - { label: "사진", name: image, widget: image }
                      - { label: "사진 아래 제목", name: title, widget: string, required: false }
                  - *style
              - &t_two_columns
                label: 좌우 2단 (왼쪽 글 + 오른쪽 주소/지도)
                name: two_columns
                widget: object
                summary: "2단 · {{fields.left_heading}}"
                fields:
                  - { label: "왼쪽 제목", name: left_heading, widget: string, required: false }
                  - { label: "왼쪽 글", name: left_body, widget: markdown, required: false, buttons: [bold, italic, link], editor_components: [] }
                  - { label: "오른쪽 제목", name: right_heading, widget: string, required: false }
                  - { label: "오른쪽 글", name: right_body, widget: markdown, required: false, buttons: [bold, italic, link], editor_components: [] }
                  - { label: "지도 검색어 (비우면 지도 숨김)", name: map_query, widget: string, required: false, hint: "지도에 표시할 주소나 장소 이름이에요. 예: 291 Daehak-ro, Yuseong-gu, Daejeon" }
                  - { label: "지도 확대 (1~21)", name: map_zoom, widget: number, value_type: int, min: 1, max: 21, default: 15 }
                  - { label: "지도 높이 (px)", name: map_height, widget: number, value_type: int, min: 120, max: 900, default: 384 }
                  - { label: "왼쪽 칸 너비 (%)", name: left_width, widget: number, value_type: int, min: 20, max: 80, default: 66 }
                  - *style
              - *t_text
              - *t_image
              - *t_image_text
              - *t_button
