# (선택) 사진 자동 축소. 사용법은 SETUP-KO.md 의 "5. 선택 기능" 참고.
# 이 파일은 저장소의 .github/workflows/optimize-images.yml 위치에 넣어야 동작합니다.
name: Optimize uploaded images
on:
  push:
    branches: [main]
    paths: ['images/uploads/**']
permissions:
  contents: write
jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save sharp
      - run: node scripts/optimize-images.mjs
      - name: Commit resized images
        run: |
          if [ -n "$(git status --porcelain images/uploads)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add images/uploads
            git commit -m "사진 자동 축소 [skip ci]"
            git push
          fi
